name: Refresh East Renfrewshire bin dates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 curl_cffi python-dateutil

      - name: Fetch dates from East Renfrewshire Council
        env:
          EAST_REN_POSTCODE: ${{ secrets.EAST_REN_POSTCODE }}
          EAST_REN_UPRN: ${{ secrets.EAST_REN_UPRN }}
        run: python scripts/east_renfrewshire_scrape.py

      - name: Publish updated schedule JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/east-renfrewshire-schedule.json
          if git diff --cached --quiet; then
            echo "Schedule has not changed; nothing to commit."
          else
            git commit -m "Refresh East Renfrewshire collection dates"
            git push
          fi
